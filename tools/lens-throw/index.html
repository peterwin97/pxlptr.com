<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0a0c;
    --surface: #111114;
    --border:  #222226;
    --text:    #ece9e0;
    --grey:    #76767b;
    --wings:   #d97706;
    --center:  #60a5fa;
    --mono:    'Space Mono', monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px;
    flex-shrink: 0;
  }

  #wordmark {
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--grey);
    text-transform: uppercase;
  }

  /* ── View toggle ── */
  #view-toggle {
    display: flex;
    gap: 2px;
    background: var(--border);
    border-radius: 4px;
    padding: 2px;
  }
  .vt-btn {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--grey);
    background: transparent;
    border: none;
    border-radius: 2px;
    padding: 4px 8px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .vt-btn.active {
    background: var(--surface);
    color: var(--text);
  }

  /* ── 3D container ── */
  #scene-wrap {
    position: absolute;
    inset: 0;
    display: none;
  }
  #scene-wrap.visible { display: block; }
  #scene-wrap canvas { width: 100% !important; height: 100% !important; display: block; }

  #load-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--grey);
    text-transform: uppercase;
    pointer-events: none;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #throw-badge {
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--text);
  }

  #throw-badge span {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  #throw-input {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--grey);
    outline: none;
    width: 3.2ch;
    text-align: right;
    -moz-appearance: textfield;
    padding: 0;
  }
  #throw-input::-webkit-outer-spin-button,
  #throw-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ── Diagram ── */
  #diagram-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  #diagram {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* ── Bottom card ── */
  #card {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 20px calc(16px + var(--safe-bot));
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }

  .card-col {
    border-left: 2px solid var(--border);
    padding-left: 12px;
  }

  .card-col.wings { border-color: var(--wings); }
  .card-col.center { border-color: var(--center); }

  .col-label {
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .col-label.wings  { color: var(--wings); }
  .col-label.center { color: var(--center); }

  .field-label {
    font-size: 8px;
    letter-spacing: .1em;
    color: var(--grey);
    text-transform: uppercase;
    margin-bottom: 2px;
    margin-top: 8px;
  }

  .field-val {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.2;
  }

  .field-val.lg {
    font-size: 15px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span id="wordmark">PXLPTR / Lens Throw</span>
    <div style="display:flex;align-items:center;gap:12px;">
      <div id="view-toggle">
        <button class="vt-btn active" data-view="2d">2D</button>
        <button class="vt-btn" data-view="3d">3D</button>
      </div>
      <div id="throw-badge">THROW <input type="number" id="throw-input" value="100" min="70" max="130">'</div>
    </div>
  </div>

  <div id="diagram-wrap">
    <canvas id="diagram"></canvas>
    <div id="scene-wrap">
      <div id="load-overlay">
        <div class="spinner"></div>
        <span>Loading model…</span>
      </div>
    </div>
  </div>

  <div id="card">
    <div class="card-col wings">
      <div class="col-label wings">Wings (SR + SL)</div>
      <div class="field-label">Ratio</div>
      <div class="field-val" id="w-ratio">—</div>
      <div class="field-label">Lens</div>
      <div class="field-val lg" id="w-lens">—</div>
      <div class="field-label">Qty</div>
      <div class="field-val" id="w-qty">—</div>
    </div>
    <div class="card-col center">
      <div class="col-label center">Center</div>
      <div class="field-label">Ratio</div>
      <div class="field-val" id="c-ratio">—</div>
      <div class="field-label">Lens</div>
      <div class="field-val lg" id="c-lens">—</div>
      <div class="field-label">Qty</div>
      <div class="field-val" id="c-qty">—</div>
    </div>
  </div>
</div>

<script>
// ── Lens config ──────────────────────────────────────────────
const LENS_CONFIG = {
  wings: {
    width: 26,
    color: '#d97706',
    quantity: '4 units (2 SR + 2 SL)',
    spare: '+ 1 spare',
    lenses: [
      { min: 70,   max: 72.8, model: 'TLD+ 2.0–2.8:1' },
      { min: 72.8, max: 117,  model: 'TLD+ 2.8–4.5:1' },
      { min: 117,  max: 130,  model: 'TLD+ 4.5–7.5:1' },
    ]
  },
  center: {
    width: 57,
    color: '#60a5fa',
    quantity: '2 units',
    spare: '+ 1 spare',
    lenses: [
      { min: 70,   max: 84.9, model: 'TLD Ultra 1.16–1.49:1' },
      { min: 84.9, max: 114,  model: 'TLD+ 1.5–2.0:1'        },
      { min: 114,  max: 130,  model: 'TLD+ 2.0–2.8:1'        },
    ]
  }
};

const THROW_MIN = 70;
const THROW_MAX = 130;

function getLens(pos, ft) {
  const cfg = LENS_CONFIG[pos];
  for (const l of cfg.lenses) if (ft >= l.min && ft <= l.max) return l.model;
  return cfg.lenses[cfg.lenses.length - 1].model;
}
function getRatio(pos, ft) { return ft / LENS_CONFIG[pos].width; }

// ── Canvas setup ─────────────────────────────────────────────
const canvas  = document.getElementById('diagram');
const ctx     = canvas.getContext('2d');

const throwInput = document.getElementById('throw-input');
const wRatio    = document.getElementById('w-ratio');
const wLens     = document.getElementById('w-lens');
const wQty      = document.getElementById('w-qty');
const cRatio    = document.getElementById('c-ratio');
const cLens     = document.getElementById('c-lens');
const cQty      = document.getElementById('c-qty');

let throwFt = 100;

// Layout (set in resize)
let W, H, trackTop, trackBot, trackX;
let stageTop, stageBot;
const PAD_H      = 20;
const STAGE_H    = 52;
const PLAT_H     = 22;
const PLAT_W     = 42;
const PLAT_GAP   = 8;

function throwToY(ft) {
  const t = (ft - THROW_MIN) / (THROW_MAX - THROW_MIN);
  return trackTop + t * (trackBot - trackTop);
}
function yToThrow(y) {
  const t = (y - trackTop) / (trackBot - trackTop);
  return Math.round(Math.min(Math.max(t * (THROW_MAX - THROW_MIN) + THROW_MIN, THROW_MIN), THROW_MAX));
}

function resize() {
  const dpr = devicePixelRatio;
  W = canvas.offsetWidth;
  H = canvas.offsetHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  stageTop = PAD_H;
  stageBot = PAD_H + STAGE_H;
  trackTop = stageBot + 16;
  trackBot = H - PAD_H - PLAT_H;
  trackX   = W / 2;
  draw();
}

function drawStage() {
  const cx  = W / 2;
  // Stage occupies ~80% of width
  const sw  = W * 0.80;
  const sx  = cx - sw / 2;

  // Rear truss / header bar
  ctx.beginPath();
  ctx.lineWidth   = 3;
  ctx.strokeStyle = '#ece9e0';
  ctx.moveTo(sx - 10, stageTop + 4);
  ctx.lineTo(sx + sw + 10, stageTop + 4);
  ctx.stroke();

  // Truss hatch marks
  ctx.lineWidth   = 1;
  ctx.strokeStyle = '#444448';
  const hatchN = 14;
  for (let i = 0; i <= hatchN; i++) {
    const x = sx + (sw / hatchN) * i;
    ctx.beginPath();
    ctx.moveTo(x - 3, stageTop + 4);
    ctx.lineTo(x + 5, stageTop + 12);
    ctx.stroke();
  }

  // Main screen rect
  ctx.beginPath();
  ctx.lineWidth   = 1.5;
  ctx.strokeStyle = '#ece9e0';
  ctx.fillStyle   = '#0f0f12';
  ctx.rect(sx, stageTop + 10, sw, STAGE_H - 14);
  ctx.fill();
  ctx.stroke();

  // Wings screen panels (left and right of center)
  const wScrW = sw * 0.22;
  ctx.strokeStyle = '#' + 'd97706' + '88';
  ctx.lineWidth   = 1;
  // SR wing panel
  ctx.strokeRect(sx, stageTop + 10, wScrW, STAGE_H - 14);
  // SL wing panel
  ctx.strokeRect(sx + sw - wScrW, stageTop + 10, wScrW, STAGE_H - 14);

  // Center screen panel
  const cScrW = sw * 0.40;
  ctx.strokeStyle = '#60a5fa88';
  ctx.strokeRect(cx - cScrW / 2, stageTop + 10, cScrW, STAGE_H - 14);

  // Stage label
  ctx.font        = '700 8px "Space Mono", monospace';
  ctx.fillStyle   = '#76767b';
  ctx.textAlign   = 'center';
  ctx.textBaseline= 'middle';
  ctx.fillText('STAGE', cx, stageTop + STAGE_H / 2 + 4);

  return { sx, sw, cx };
}

function drawPlatforms(platY) {
  // Three groups: SR Wings | Center | SL Wings
  // Total width of 3 platforms + gaps
  const totalW = PLAT_W * 3 + PLAT_GAP * 2;
  const startX = W / 2 - totalW / 2;

  const groups = [
    { x: startX,                         label: 'SR',  color: LENS_CONFIG.wings.color  },
    { x: startX + PLAT_W + PLAT_GAP,     label: 'CTR', color: LENS_CONFIG.center.color },
    { x: startX + (PLAT_W + PLAT_GAP)*2, label: 'SL',  color: LENS_CONFIG.wings.color  },
  ];

  groups.forEach(({ x, label, color }) => {
    // Platform body
    ctx.beginPath();
    ctx.fillStyle   = '#0a0a0c';
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.5;
    ctx.rect(x, platY - PLAT_H / 2, PLAT_W, PLAT_H);
    ctx.fill();
    ctx.stroke();

    // Projector lens dot
    const cx = x + PLAT_W / 2;
    const cy = platY;
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // Label
    ctx.font        = '400 7px "Space Mono", monospace';
    ctx.fillStyle   = color;
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText(label, cx, platY + PLAT_H / 2 + 8);
  });

  return { groups, startX, totalW };
}

function drawFOV(stageInfo, platY) {
  const { sx, sw, cx } = stageInfo;
  const stageEdgeY = stageBot - 4;
  const srcY = platY - PLAT_H / 2;

  const totalW = PLAT_W * 3 + PLAT_GAP * 2;
  const startX = W / 2 - totalW / 2;

  // ── Wings FOV (amber) — from SR + SL platforms to wing screen edges ──
  const srCx = startX + PLAT_W / 2;
  const slCx = startX + (PLAT_W + PLAT_GAP) * 2 + PLAT_W / 2;
  const wScrW = sw * 0.22;
  const wColor = LENS_CONFIG.wings.color;

  ctx.setLineDash([5, 5]);
  ctx.lineWidth   = 1.2;
  ctx.strokeStyle = wColor;

  // SR → left wing panel (outer left edge and inner edge)
  drawLine(srCx, srcY, sx, stageEdgeY);
  drawLine(srCx, srcY, sx + wScrW, stageEdgeY);

  // SL → right wing panel
  drawLine(slCx, srcY, sx + sw - wScrW, stageEdgeY);
  drawLine(slCx, srcY, sx + sw, stageEdgeY);

  // Subtle wing fill
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(srCx, srcY);
  ctx.lineTo(sx, stageEdgeY);
  ctx.lineTo(sx + wScrW, stageEdgeY);
  ctx.closePath();
  ctx.fillStyle = wColor + '14';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(slCx, srcY);
  ctx.lineTo(sx + sw - wScrW, stageEdgeY);
  ctx.lineTo(sx + sw, stageEdgeY);
  ctx.closePath();
  ctx.fillStyle = wColor + '14';
  ctx.fill();

  // ── Center FOV (blue) — from center platform to center screen ──
  const ctrCx  = startX + PLAT_W + PLAT_GAP + PLAT_W / 2;
  const cScrW  = sw * 0.40;
  const cColor = LENS_CONFIG.center.color;

  ctx.setLineDash([5, 5]);
  ctx.lineWidth   = 1.2;
  ctx.strokeStyle = cColor;

  drawLine(ctrCx, srcY, cx - cScrW / 2, stageEdgeY);
  drawLine(ctrCx, srcY, cx + cScrW / 2, stageEdgeY);

  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(ctrCx, srcY);
  ctx.lineTo(cx - cScrW / 2, stageEdgeY);
  ctx.lineTo(cx + cScrW / 2, stageEdgeY);
  ctx.closePath();
  ctx.fillStyle = cColor + '14';
  ctx.fill();

  ctx.setLineDash([]);
}

function drawLine(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawTrack(platY) {
  // Center track line
  ctx.beginPath();
  ctx.setLineDash([3, 7]);
  ctx.lineWidth   = 1;
  ctx.strokeStyle = '#2a2a2e';
  ctx.moveTo(trackX, trackTop);
  ctx.lineTo(trackX, trackBot + PLAT_H / 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Distance ticks
  const ticks = [70, 80, 90, 100, 110, 120, 130];
  ctx.font        = '400 8px "Space Mono", monospace';
  ctx.textAlign   = 'right';
  ctx.textBaseline= 'middle';
  ctx.fillStyle   = '#333338';
  ticks.forEach(ft => {
    const y = throwToY(ft);
    ctx.beginPath();
    ctx.lineWidth   = 1;
    ctx.strokeStyle = '#222226';
    ctx.moveTo(trackX - 12, y);
    ctx.lineTo(trackX + 12, y);
    ctx.stroke();
    ctx.fillText(`${ft}'`, trackX - 16, y);
  });

  // Active throw label right of knob
  ctx.font        = '700 10px "Space Mono", monospace';
  ctx.fillStyle   = '#ece9e0';
  ctx.textAlign   = 'left';
  ctx.textBaseline= 'middle';
  ctx.fillText(`${throwFt}'`, trackX + PLAT_W * 1.5 + PLAT_GAP + 12, platY);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const platY    = throwToY(throwFt);
  const stageInfo = drawStage();
  drawTrack(platY);
  drawFOV(stageInfo, platY);
  drawPlatforms(platY);
}

function updateCard() {
  const wRat = getRatio('wings', throwFt);
  const cRat = getRatio('center', throwFt);
  throwInput.value = throwFt;
  wRatio.textContent = `${wRat.toFixed(2)}:1`;
  wLens.textContent  = getLens('wings', throwFt);
  wQty.textContent   = `${LENS_CONFIG.wings.quantity}\n${LENS_CONFIG.wings.spare}`;
  cRatio.textContent = `${cRat.toFixed(2)}:1`;
  cLens.textContent  = getLens('center', throwFt);
  cQty.textContent   = `${LENS_CONFIG.center.quantity}\n${LENS_CONFIG.center.spare}`;
}

function update() { draw(); updateCard(); }

// ── Drag ──────────────────────────────────────────────────────
let dragging = false;

function hitKnob(y) {
  return Math.abs(y - throwToY(throwFt)) < 32;
}

canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  if (hitKnob(e.clientY - rect.top)) {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const rect = canvas.getBoundingClientRect();
  throwFt = yToThrow(e.clientY - rect.top);
  requestAnimationFrame(update);
});

canvas.addEventListener('pointerup',    () => { dragging = false; });
canvas.addEventListener('pointercancel',() => { dragging = false; });

// ── Throw input ───────────────────────────────────────────────
throwInput.addEventListener('focus', () => { throwInput.select(); });
throwInput.addEventListener('input', () => {
  const v = parseInt(throwInput.value, 10);
  if (!isNaN(v)) {
    throwFt = Math.min(Math.max(v, THROW_MIN), THROW_MAX);
    update();
  }
});
throwInput.addEventListener('blur', () => {
  throwFt = Math.min(Math.max(parseInt(throwInput.value, 10) || throwFt, THROW_MIN), THROW_MAX);
  throwInput.value = throwFt;
  update();
});
throwInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') throwInput.blur();
});

// ── Init ──────────────────────────────────────────────────────
const ro = new ResizeObserver(resize);
ro.observe(canvas.parentElement);
resize();
update();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/tools/lens-throw/service-worker.js');
}
</script>

<!-- Three.js 3D view -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const sceneWrap   = document.getElementById('scene-wrap');
const loadOverlay = document.getElementById('load-overlay');
const vtBtns      = document.querySelectorAll('.vt-btn');
const diagramEl   = document.getElementById('diagram');

let renderer, scene, camera, controls, modelLoaded = false;

function initThree() {
  const w = sceneWrap.clientWidth;
  const h = sceneWrap.clientHeight;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  sceneWrap.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0c);

  // Ambient + directional lights
  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const dir = new THREE.DirectionalLight(0xffffff, 2);
  dir.position.set(0, 50, 30);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.6);
  dir2.position.set(0, -20, -20);
  scene.add(dir2);

  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100000);
  // Start top-down, slightly angled
  camera.position.set(0, 8000, 4000);
  camera.lookAt(0, 0, 0);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 500;
  controls.maxDistance = 40000;
  controls.target.set(0, 0, 0);

  const ro = new ResizeObserver(() => {
    const w2 = sceneWrap.clientWidth, h2 = sceneWrap.clientHeight;
    renderer.setSize(w2, h2);
    camera.aspect = w2 / h2;
    camera.updateProjectionMatrix();
  });
  ro.observe(sceneWrap);

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function loadModel() {
  if (modelLoaded) return;
  modelLoaded = true;
  loadOverlay.style.display = 'flex';

  const draco = new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/libs/draco/');

  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);

  loader.load(
    '/tools/lens-throw/3D-stage/glb/stage-draco.glb',
    gltf => {
      const model = gltf.scene;

      scene.add(model);

      // Fit camera using bounding sphere + FOV formula
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const sphere = new THREE.Sphere();
      box.getBoundingSphere(sphere);
      const r = sphere.radius;

      const fovRad = camera.fov * (Math.PI / 180);
      const dist = (r / Math.tan(fovRad / 2)) * 1.5;

      camera.near = dist / 1000;
      camera.far  = dist * 20;
      camera.position.set(center.x, center.y + dist * 0.75, center.z + dist * 0.6);
      camera.lookAt(center);
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.minDistance = r * 0.5;
      controls.maxDistance = dist * 6;
      controls.update();

      loadOverlay.style.display = 'none';
    },
    xhr => {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      loadOverlay.querySelector('span').textContent = `Loading… ${pct}%`;
    },
    err => {
      loadOverlay.querySelector('span').textContent = 'Failed to load model';
      console.error(err);
    }
  );
}

// ── View toggle ───────────────────────────────────────────────
vtBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    vtBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (btn.dataset.view === '3d') {
      diagramEl.style.display = 'none';
      sceneWrap.classList.add('visible');
      if (!renderer) initThree();
      loadModel();
    } else {
      diagramEl.style.display = 'block';
      sceneWrap.classList.remove('visible');
    }
  });
});
</script>
</body>
